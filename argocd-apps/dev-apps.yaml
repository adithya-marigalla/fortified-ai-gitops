apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-dev-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/adithya-marigalla/fortified-ai-gitops.git'
    targetRevision: HEAD
    path: workloads/vllm-mock/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
