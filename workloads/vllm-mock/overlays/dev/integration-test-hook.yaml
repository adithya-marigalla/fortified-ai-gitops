apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-integration-test
  annotations:
    # 1. Tell ArgoCD this is a Hook, not a standard resource
    argocd.argoproj.io/hook: PostSync
    
    # 2. Tell ArgoCD to delete this test pod after it finishes (pass or fail)
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  backoffLimit: 1 # Only retry once if it fails
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test-runner
        image: busybox:1.28
        # The Test: Try to fetch the homepage of our mock AI service
        command: ['sh', '-c', 'wget -qO- http://dev-vllm-mock-svc-v2 || exit 1']
