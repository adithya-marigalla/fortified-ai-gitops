apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vllm-mock
spec:
  selector:
    matchLabels:
      app: vllm-mock
  template:
    metadata:
      labels:
        app: vllm-mock
    spec:
      containers:
      - name: vllm-container
        image: nginx:1.24-alpine  # Mocking the heavy AI image
        ports:
        - containerPort: 80
