apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mock
  template:
    metadata:
      labels:
        app: vllm-mock
    spec:
      containers:
      - name: vllm-container
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
